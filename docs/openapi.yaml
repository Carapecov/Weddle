{
  "openapi": "3.0.3",
  "info": {
    "title": "Weddell Pay — API de simulação de Split Payment",
    "version": "1.0.0",
    "description": "Contrato MVP de simulação acadêmica sem movimentação financeira, NF-e real ou recolhimento tributário. CBS/IBS são valores nominais fictícios. Todas as mutações de pagamento exigem Idempotency-Key. Mesma chave+comando retorna status/corpo originais; GET retorna estado atual. Retenção das chaves durante toda a vida do cenário. Corpo JSON máximo 16 KiB; 60 requisições/min por chave e 30 falhas auth/min por IP. Falhas transitórias não reservam resultado final. Logs operacionais sete dias; auditoria/razão permanentes no cenário. Não existem rotas de edição/cancelamento, emissão de credenciais, gateway real ou injeção HTTP de falhas."
  },
  "servers": [
    {
      "url": "http://localhost:8000",
      "description": "Desenvolvimento local; credenciais de demonstração provisionadas por CLI."
    }
  ],
