    "/api/v1/payments": {
      "post": {
        "operationId": "createPayment",
        "tags": [
          "Pagamentos"
        ],
        "summary": "Criar pagamento simulado idempotente",
        "description": "Exige documento existente do mesmo vendedor, amount_cents igual ao bruto e BRL. Documentos já liquidados (inclusive estornados) não aceitam novo pagamento; novas tentativas após FAILED são permitidas enquanto não houver liquidação. Scenario é obrigatório e imutável. Nunca aceitar failure_mode pela API.",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PaymentCreate"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "CREATED; repetição da mesma chave/comando preserva esta resposta e status mesmo após transições posteriores.",
            "headers": {
              "X-Correlation-ID": {
                "$ref": "#/components/headers/CorrelationID"
              },
              "Location": {
                "schema": {
                  "type": "string"
                },
                "description": "URI relativa do recurso criado; preservada em replay."
              },
              "Idempotency-Replayed": {
                "schema": {
                  "type": "boolean"
                },
                "description": "true quando status/corpo vieram do resultado persistido desta chave."
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Payment"
                }
              }
            }
          },
          "400": {
