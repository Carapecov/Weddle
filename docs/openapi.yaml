    {
      "name": "Vendedores"
    },
    {
      "name": "Documentos"
    },
    {
      "name": "Pagamentos"
    },
    {
      "name": "Consultas"
    },
    {
      "name": "Operação"
    }
  ],
  "security": [
    {
      "BearerDemo": []
    }
  ],
