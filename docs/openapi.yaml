  "components": {
    "securitySchemes": {
      "BearerDemo": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "opaque-demo-token",
        "description": "Token opaco de demonstração, hash no banco. Role operator só cria vendedor; role merchant acessa seus próprios documentos/pagamentos. Emitido por CLI, nunca devolvido em POST merchants."
      }
    },
    "headers": {
      "CorrelationID": {
        "description": "UUID gerado pelo servidor nesta requisição; pode diferir da correlação armazenada no corpo de um replay.",
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    },
    "parameters": {
      "PaymentID": {
        "name": "id",
        "in": "path",
        "required": true,
        "description": "UUID do pagamento; recurso de outro vendedor é indistinguível de ausente (404).",
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "description": "Escopo vendedor/operação/recurso/chave. 1–128 caracteres ASCII visíveis. Mesma chave com comando diferente retorna 409. Retida por toda a vida do cenário.",
        "schema": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128,
          "pattern": "^[!-~]{1,128}$"
        },
        "example": "demo-payment-001"
      },
      "Limit": {
        "name": "limit",
        "in": "query",
        "required": false,
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 50
        }
      },
      "Cursor": {
        "name": "cursor",
        "in": "query",
        "required": false,
        "description": "Cursor opaco devolvido pela página anterior. Inválido/incompatível retorna 422.",
        "schema": {
          "type": "string",
          "minLength": 1,
          "maxLength": 1024
        }
      }
    },
    "schemas": {
      "MerchantCreate": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "name": {
            "type": "string",
            "pattern": "^DEMO-[A-Z0-9_-]{3,48}$",
            "example": "DEMO-ARCTIC"
          },
          "virtual_account_id": {
            "type": "string",
