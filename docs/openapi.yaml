        "description": "Autoriza somente CREATED conforme scenario persistido. approved produz AUTHORIZED; declined produz FAILED/AUTHORIZATION_DECLINED, ambos HTTP 200 e sem partidas. Não enviar corpo (objeto JSON vazio é aceito como comando vazio). Mesma chave/comando reapresenta status/corpo originais. Chave diferente após esta transição concluída ou estado incompatível retorna 409 sem novos efeitos. Operação restrita ao vendedor proprietário.",
