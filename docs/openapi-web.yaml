      "post": {
        "operationId": "webCreatePayment",
        "summary": "Criar documento+pagamento atomicamente pelo formulário",
        "description": "Não aceitar merchant_id ou documento do navegador. Validar Idempotency-Key antes de hash. Núcleo usa create_payment/resource=create/chave web-create:SHA256(header). Mesmo comando/chave devolve 201/corpo originais; divergente409. Soma CBS+IBS <= bruto. Scenario imutável e somente didático.",
        "parameters": [
          {
            "$ref": "#/components/parameters/CsrfToken"
          },
          {
            "$ref": "./openapi.yaml#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/WebPaymentCreate"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "CREATED persistido, documento e resultado idempotente no mesmo commit.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./openapi.yaml#/components/schemas/Payment"
                }
              }
            },
            "headers": {
              "Location": {
                "schema": {
                  "type": "string"
                },
                "description": "/web/payments/{id}"
              },
              "Idempotency-Replayed": {
                "schema": {
                  "type": "boolean"
