  "components": {
    "securitySchemes": {
      "DemoSession": {
        "type": "apiKey",
        "in": "cookie",
        "name": "weddell-pay-session",
        "description": "Cookie HttpOnly gerenciado pelo navegador; nome configurável por SESSION_COOKIE/APP_NAME. Sessão contém apenas IDs e é revalidada a cada requisição. Não enviar manualmente Bearer."
      }
    },
    "parameters": {
      "CsrfToken": {
        "name": "X-CSRF-TOKEN",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "minLength": 1
        },
        "description": "Valor da meta csrf-token da página atual. Sessão e token giram ao abrir/encerrar; após419 atualizar página."
      },
      "PaymentId": {
        "name": "id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    },
    "schemas": {
      "ExactAggregate": {
        "oneOf": [
          {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "maximum": 9007199254740991
          },
          {
            "type": "string",
            "pattern": "^(0|[1-9][0-9]*)$"
          }
        ],
        "description": "Agregado exato: inteiro até JS MAX_SAFE_INTEGER; acima, dígitos decimais string sem conversão float."
      },
      "WebPaymentCreate": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "gross_amount_cents": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 1000000000000
          },
          "cbs_amount_cents": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "maximum": 1000000000000
          },
          "ibs_amount_cents": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "maximum": 1000000000000
          },
          "scenario": {
            "type": "string",
            "enum": [
              "approved",
              "declined"
            ]
          }
        },
        "required": [
          "gross_amount_cents",
          "cbs_amount_cents",
          "ibs_amount_cents",
          "scenario"
        ]
      },
      "Overview": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "summary": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "total_amount_cents": {
                "$ref": "#/components/schemas/ExactAggregate"
              },
              "settled_amount_cents": {
                "$ref": "#/components/schemas/ExactAggregate"
              },
              "total_payments": {
                "$ref": "#/components/schemas/ExactAggregate"
              },
              "authorized_count": {
                "$ref": "#/components/schemas/ExactAggregate"
              },
              "failed_count": {
                "$ref": "#/components/schemas/ExactAggregate"
              },
              "refunded_count": {
                "$ref": "#/components/schemas/ExactAggregate"
              },
              "settled_count": {
                "$ref": "#/components/schemas/ExactAggregate"
              },
              "cbs_amount_cents": {
                "$ref": "#/components/schemas/ExactAggregate"
              },
              "ibs_amount_cents": {
                "$ref": "#/components/schemas/ExactAggregate"
              },
              "merchant_net_cents": {
                "$ref": "#/components/schemas/ExactAggregate"
              }
            },
            "required": [
              "total_amount_cents",
              "settled_amount_cents",
              "total_payments",
              "authorized_count",
              "failed_count",
              "refunded_count",
              "settled_count",
              "cbs_amount_cents",
              "ibs_amount_cents",
              "merchant_net_cents"
            ]
          },
          "daily": {
            "type": "array",
            "minItems": 7,
            "maxItems": 7,
            "items": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "date": {
                  "type": "string",
                  "format": "date",
                  "description": "Dia America/Sao_Paulo, incluindo zeros reais nos seis dias anteriores sem registros."
                },
                "amount_cents": {
                  "$ref": "#/components/schemas/ExactAggregate"
                },
                "count": {
                  "$ref": "#/components/schemas/ExactAggregate"
                }
              },
              "required": [
                "date",
                "amount_cents",
                "count"
              ]
            }
          },
          "recent": {
            "type": "array",
            "maxItems": 6,
            "items": {
              "$ref": "./openapi.yaml#/components/schemas/Payment"
            }
          }
        },
        "required": [
          "summary",
          "daily",
          "recent"
        ]
      },
      "PaymentPage": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "data": {
            "type": "array",
            "maxItems": 50,
            "items": {
              "$ref": "./openapi.yaml#/components/schemas/Payment"
            }
          },
          "meta": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "current_page": {
                "type": "integer",
                "minimum": 1,
                "maximum": 1000000
              },
              "last_page": {
                "$ref": "#/components/schemas/ExactAggregate"
              },
              "total": {
                "$ref": "#/components/schemas/ExactAggregate"
              },
              "per_page": {
                "type": "integer",
                "minimum": 1,
                "maximum": 50
              }
            },
            "required": [
              "current_page",
              "last_page",
              "total",
              "per_page"
            ]
          }
        },
        "required": [
          "data",
          "meta"
        ]
      },
      "Detail": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "payment": {
            "$ref": "./openapi.yaml#/components/schemas/Payment"
          },
          "document": {
            "$ref": "./openapi.yaml#/components/schemas/FiscalDocument"
          },
          "ledger": {
            "type": "array",
            "maxItems": 100,
            "items": {
              "$ref": "./openapi.yaml#/components/schemas/LedgerEntry"
            }
          },
          "events": {
            "type": "array",
            "maxItems": 100,
            "items": {
              "$ref": "./openapi.yaml#/components/schemas/PaymentEvent"
            }
          }
        },
        "required": [
          "payment",
          "document",
          "ledger",
          "events"
        ]
      },
      "Redirect": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "redirect": {
            "type": "string",
            "enum": [
              "/",
              "/app"
            ]
          }
        },
        "required": [
          "redirect"
        ]
      },
      "Examples": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "seeded": {
            "type": "boolean",
            "enum": [
              true
            ]
          },
          "created_count": {
            "type": "integer",
            "minimum": 0,
            "maximum": 6
          }
        },
        "required": [
          "seeded",
          "created_count"
        ]
      },
      "Empty": {
        "type": "object",
        "additionalProperties": false,
        "properties": {},
        "required": []
      }
    },
