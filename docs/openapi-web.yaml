{
  "openapi": "3.0.3",
  "info": {
    "title": "Weddell Pay — demonstração web local",
    "version": "1.0.0",
    "description": "Complemento do contrato API v1. Sessão criptografada same-origin, sem Bearer no navegador, sem movimentação real ou autenticação de produção. CSRF obrigatório em todas as mutações; corpo16KiB e60requisições/minuto/credencial. Erros sanitizados; cookieHttpOnlyStrict; CSPself semJSinline; nenhuma publicação autorizada."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:8000"
    }
  ],
  "security": [
    {
      "DemoSession": []
    }
  ],
  "paths": {
    "/": {
      "get": {
        "operationId": "webLanding",
        "security": [],
        "summary": "Landing com meta csrf-token e cookie anônimo.",
        "responses": {
          "200": {
            "description": "Landing com meta csrf-token e cookie anônimo.",
            "content": {
              "text/html": {
                "schema": {
                  "type": "string"
                }
              }
            }
          }
        }
      }
    },
    "/docs": {
      "get": {
        "operationId": "webDocs",
        "security": [],
        "summary": "Documentação HTML local.",
        "responses": {
          "200": {
            "description": "Documentação HTML local.",
            "content": {
              "text/html": {
                "schema": {
                  "type": "string"
                }
              }
            }
          }
        }
      }
    },
    "/app": {
      "get": {
        "operationId": "webApp",
        "security": [
          {
            "DemoSession": []
          }
        ],
        "summary": "Dashboard; sem sessão de navegador retorna 302 para /.",
        "responses": {
          "200": {
            "description": "Dashboard; sem sessão de navegador retorna 302 para /.",
            "content": {
              "text/html": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "302": {
            "description": "Sessão ausente; redirecionar para landing.",
            "headers": {
              "Location": {
                "schema": {
                  "type": "string",
                  "example": "/"
                }
              }
            }
          }
        }
      }
    },
    "/web/session": {
      "post": {
        "operationId": "webStartSession",
        "summary": "Abrir ou reutilizar demonstração isolada",
        "description": "Local/testing e IP loopback. Cookie anônimo+CSRF do GET /. Credencial interna nunca é devolvida. Nova sessão cria seis pagamentos reais e gira ID/CSRF; reutilização não duplica exemplos. Até dez novos provisionamentos/minuto/IP.",
        "parameters": [
          {
            "$ref": "#/components/parameters/CsrfToken"
          }
        ],
        "requestBody": {
          "required": false,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Empty"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "redirect=/app. Cookie HttpOnly/SameSiteStrict; sessão arquivo criptografada.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Redirect"
                }
              }
            },
            "headers": {
              "X-Correlation-ID": {
