        "summary": "Filtrar e paginar pagamentos do próprio vendedor",
        "parameters": [
          {
            "name": "status",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "ALL",
                "CREATED",
                "AUTHORIZED",
                "SETTLED",
                "FAILED",
                "REFUNDED"
              ],
              "default": "ALL"
            }
          },
          {
            "name": "search",
            "in": "query",
            "schema": {
              "type": "string",
              "maxLength": 80
            },
            "description": "Busca literal em UUID/referência fiscal; sem caracteres de controle."
          },
          {
            "name": "page",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 1000000,
              "default": 1
