name: weddell-pay
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_DB: weddell_pay
      POSTGRES_USER: weddell_owner
      POSTGRES_PASSWORD: ${WEDDELL_DB_OWNER_PASSWORD:?Run scripts/setup.ps1}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - weddell_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weddell_owner -d weddell_pay"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  weddell_pgdata:
